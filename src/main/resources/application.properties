spring.application.name=backend

# Datasource (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:loansdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola H2 (solo para desarrollo/demo de la prueba tecnica)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=ChangeThisSecretKeyForJwtSigningInProductionUseEnvVar123456
jwt.expiration-ms=3600000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
